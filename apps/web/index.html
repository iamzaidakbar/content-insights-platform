<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Insights Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applies the cached theme synchronously before first paint to avoid FOUC.
      // Cache shape is flat UserSettingsDefaults (theme at top level). Falls back
      // to nested appearance.theme for any stale pre-pivot cache entries.
      (function () {
        try {
          var raw = localStorage.getItem('ci-settings-cache');
          var cached = raw ? JSON.parse(raw) : null;
          var theme =
            (cached && cached.theme) ||
            (cached && cached.appearance && cached.appearance.theme) ||
            'light';
          var resolvedTheme =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : theme === 'dark'
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', resolvedTheme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
