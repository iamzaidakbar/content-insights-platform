apiVersion: apps/v1
kind: Deployment
metadata:
  name: cip-api
  namespace: cip
  labels:
    app.kubernetes.io/name: cip-api
    app.kubernetes.io/part-of: content-insights-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cip-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cip-api
        app.kubernetes.io/part-of: content-insights-platform
    spec:
      containers:
        - name: api
          image: ghcr.io/iamzaidakbar/cip-api:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cip-api-config
            - secretRef:
                name: cip-api-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/apps/api/uploads
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        # Single-replica only; multi-replica needs shared/object storage.
        - name: uploads
          emptyDir: {}
