services:
  mongodb:
    image: mongo:8.0
    container_name: cip-mongodb
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: ''rs0'', members: [{ _id: 0, host: ''mongodb:27017'' }] }).ok }"',
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s
    networks:
      - cip-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: cip-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - cip-network

  redis:
    image: redis:8-alpine
    container_name: cip-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cip-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: cip-api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-4000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/content-insights?replicaSet=rs0}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - '${API_PORT:-4000}:${API_PORT:-4000}'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cip-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: cip-web
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      WEB_PORT: ${WEB_PORT:-5173}
    ports:
      - '${WEB_PORT:-5173}:${WEB_PORT:-5173}'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/apps/web/node_modules
      - /app/packages/shared/node_modules
    depends_on:
      - api
    networks:
      - cip-network

networks:
  cip-network:
    driver: bridge

volumes:
  mongodb_data:
  elasticsearch_data:
  redis_data:
